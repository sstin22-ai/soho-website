<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG Tiny 1.2//EN"
  "http://www.w3.org/Graphics/SVG/1.2/Tiny/svg12.dtd">
<svg version="1.2" baseProfile="tiny-ps"
     xmlns="http://www.w3.org/2000/svg"
     width="240" height="240"
     viewBox="0 0 240 240"
     xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <title>SoHo Media House</title>
  <desc>SoHo Media House — Digital Agency</desc>

  <!-- BIMI requires solid non-transparent background -->
  <rect x="0" y="0" width="240" height="240" fill="#0a0a0f"/>

  <!-- Ember orange border ring -->
  <rect x="6" y="6" width="228" height="228" rx="18"
        fill="none" stroke="#FF6B35" stroke-width="3"/>

  <!-- Top label: DIGITAL AGENCY -->
  <text x="120" y="62"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="400"
        fill="#FF6B35"
        text-anchor="middle"
        letter-spacing="4">DIGITAL AGENCY</text>

  <!-- Divider line top -->
  <line x1="40" y1="74" x2="200" y2="74"
        stroke="rgba(255,107,53,0.3)" stroke-width="0.75"/>

  <!-- Main wordmark: SoHo -->
  <text x="120" y="128"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="54"
        font-weight="500"
        fill="#ffffff"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-1">SoHo</text>

  <!-- Divider line bottom -->
  <line x1="40" y1="152" x2="200" y2="152"
        stroke="rgba(255,107,53,0.3)" stroke-width="0.75"/>

  <!-- Sub wordmark: MEDIA HOUSE -->
  <text x="120" y="178"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="400"
        fill="rgba(255,255,255,0.55)"
        text-anchor="middle"
        letter-spacing="5">MEDIA HOUSE</text>

  <!-- Bottom ember dot trio -->
  <circle cx="108" cy="205" r="3" fill="rgba(255,107,53,0.4)"/>
  <circle cx="120" cy="205" r="3" fill="#FF6B35"/>
  <circle cx="132" cy="205" r="3" fill="rgba(255,107,53,0.4)"/>

</svg>
